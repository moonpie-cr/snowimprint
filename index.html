<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>雪林小屋 · 雪地印记 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Zhi+Mang+Xing&family=Liu+Jian+Mao+Cao&family=ZCOOL+KuaiLe&family=ZCOOL+QingKe+HuangYou&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: dark;
  --ink:#eaf3ff; --ink-2:#a8c0d8;
  --glass:rgba(14,26,44,.46); --glass-hi:rgba(255,255,255,.13);
  --line:rgba(178,210,240,.22);
  --accent:#ffb45e;
  --shadow:0 10px 30px rgba(0,0,0,.32);
}
@media (prefers-color-scheme: dark){ :root{ --ink:#eaf3ff; --ink-2:#a8c0d8; } }
:root[data-theme="dark"]{ --ink:#eaf3ff; --ink-2:#a8c0d8; }
:root[data-theme="light"]{ --ink:#f2f7ff; --ink-2:#b6c9dd; }

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:#050a14;color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-user-select:none;user-select:none;overscroll-behavior:none}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#scene.paint{cursor:crosshair}
#scene.orbit{cursor:grab}

.brand{position:fixed;left:16px;top:calc(14px + env(safe-area-inset-top));pointer-events:none;z-index:4}
.brand h1{margin:0;font-size:16px;font-weight:600;letter-spacing:.1em;text-shadow:0 2px 14px rgba(0,0,0,.6)}
.brand h1 span{color:var(--accent);font-weight:400}
.brand p{margin:5px 0 0;font-size:11.5px;letter-spacing:.05em;color:var(--ink-2)}

.topr{position:fixed;right:14px;top:calc(12px + env(safe-area-inset-top));display:flex;gap:8px;z-index:6}
.pill{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;border:1px solid var(--line);
  background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:var(--ink);
  font:inherit;font-size:12px;cursor:pointer;box-shadow:var(--shadow);transition:background .2s,border-color .2s,transform .15s}
.pill:hover{background:var(--glass-hi)}
.pill:active{transform:scale(.96)}
.pill.on{border-color:rgba(255,180,94,.65);background:linear-gradient(180deg,rgba(255,180,94,.32),rgba(255,180,94,.12));
  box-shadow:0 0 20px rgba(255,168,74,.25),var(--shadow)}

.bottom{position:fixed;left:0;right:0;bottom:calc(12px + env(safe-area-inset-bottom));display:flex;flex-direction:column;
  align-items:center;gap:9px;pointer-events:none;z-index:6;padding:0 10px}
.hint{font-size:11.5px;color:var(--ink-2);background:rgba(8,16,30,.38);border:1px solid rgba(178,210,240,.12);
  padding:6px 14px;border-radius:999px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);text-align:center;max-width:min(94vw,560px)}
.seg{display:none;gap:4px;padding:4px;border-radius:999px;background:var(--glass);border:1px solid var(--line);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);pointer-events:auto}
.seg.show{display:flex}
.seg button{border:0;background:transparent;color:var(--ink-2);font:inherit;font-size:11.5px;padding:5px 12px;border-radius:999px;cursor:pointer}
.seg button.on{background:rgba(255,180,94,.25);color:var(--ink)}
.dock{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;pointer-events:auto;max-width:760px}
.tool{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 10px;min-width:60px;border-radius:14px;
  border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(16px) saturate(1.2);-webkit-backdrop-filter:blur(16px) saturate(1.2);
  color:var(--ink);font:inherit;font-size:11px;cursor:pointer;box-shadow:var(--shadow);transition:transform .18s,background .2s,border-color .2s,box-shadow .2s}
.tool .ic{font-size:17px;line-height:1.05}
.tool:hover{transform:translateY(-3px);background:var(--glass-hi)}
.tool:active{transform:scale(.95)}
.tool.on{background:linear-gradient(180deg,rgba(255,180,94,.32),rgba(255,180,94,.12));border-color:rgba(255,180,94,.62);
  box-shadow:0 0 22px rgba(255,168,74,.28),0 10px 26px rgba(0,0,0,.3)}
.sep{width:1px;align-self:stretch;background:var(--line);margin:4px 2px}

/* 文字面板 */
.panel{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translate(-50%,12px);
  width:min(440px,94vw);padding:14px 14px 12px;border-radius:18px;border:1px solid var(--line);
  background:rgba(12,22,40,.72);backdrop-filter:blur(20px) saturate(1.2);-webkit-backdrop-filter:blur(20px) saturate(1.2);
  box-shadow:0 18px 50px rgba(0,0,0,.45);z-index:8;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;
  -webkit-user-select:text;user-select:text}
.panel.show{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
.panel h3{margin:0 0 10px;font-size:13px;font-weight:600;letter-spacing:.06em;display:flex;justify-content:space-between;align-items:center}
.panel h3 button{border:0;background:transparent;color:var(--ink-2);font-size:16px;cursor:pointer;padding:0 4px}
.panel input{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.07);
  color:var(--ink);font:inherit;font-size:15px;outline:none}
.panel input:focus{border-color:rgba(255,180,94,.6)}
.fonts{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:10px 0}
.font{border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--ink);border-radius:12px;padding:7px 4px 6px;
  cursor:pointer;text-align:center;transition:border-color .2s,background .2s}
.font b{display:block;font-size:22px;font-weight:400;line-height:1.25;white-space:nowrap;overflow:hidden}
.font small{display:block;font-size:10.5px;color:var(--ink-2);margin-top:2px}
.font.on{border-color:rgba(255,180,94,.7);background:rgba(255,180,94,.16)}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.row .seg{display:flex}
.go{flex:1;border:0;border-radius:12px;padding:10px 14px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;color:#2a1606;
  background:linear-gradient(180deg,#ffc982,#ffa64a);box-shadow:0 6px 20px rgba(255,160,70,.35)}
.go:active{transform:scale(.97)}
.tip{font-size:10.5px;color:var(--ink-2);margin-top:8px;line-height:1.5}

/* 宝丽来 */
.polos{position:fixed;left:14px;bottom:calc(140px + env(safe-area-inset-bottom));display:flex;gap:10px;align-items:flex-end;z-index:5;pointer-events:none}
.polaroid{position:relative;width:124px;padding:7px 7px 0;background:#f8f6f1;border-radius:2px;pointer-events:auto;cursor:pointer;
  box-shadow:0 14px 30px rgba(0,0,0,.45);transform-origin:50% 100%;animation:poloIn .8s cubic-bezier(.18,.9,.28,1.16) both;transition:transform .3s}
@keyframes poloIn{0%{opacity:0;transform:translateY(-40px) scale(.86)}100%{opacity:1}}
.polaroid img{display:block;width:100%}
.polaroid .cap{font-family:"Ma Shan Zheng","Kaiti SC","STKaiti",serif;color:#2b2b28;font-size:12.5px;text-align:center;padding:5px 2px 0}
.polaroid .meta{font-size:8.5px;color:#9b9b93;text-align:center;padding:2px 0 7px;letter-spacing:.1em}
.polaroid .x{position:absolute;top:-7px;right:-7px;width:20px;height:20px;border-radius:50%;background:rgba(20,30,44,.92);color:#dbe8f7;
  border:1px solid rgba(255,255,255,.28);font-size:11px;line-height:18px;padding:0;cursor:pointer;opacity:0;transition:opacity .2s}
.polaroid:hover .x{opacity:1}
.flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:20}
.flash.go{animation:flash .5s ease-out}
@keyframes flash{0%{opacity:.85}100%{opacity:0}}

.toast{position:fixed;left:50%;top:15%;transform:translate(-50%,-6px);background:rgba(10,20,36,.66);border:1px solid rgba(180,212,242,.22);
  color:#eaf3ff;font-size:12.5px;padding:9px 18px;border-radius:999px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;z-index:15;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
.toast.on{opacity:1;transform:translate(-50%,0)}

.temp{position:fixed;left:16px;top:calc(62px + env(safe-area-inset-top));display:flex;align-items:center;gap:7px;z-index:4;pointer-events:none;
  padding:5px 11px 5px 8px;border-radius:999px;background:rgba(8,16,30,.4);border:1px solid rgba(178,210,240,.14);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-size:11px;color:var(--ink-2)}
.temp .bar{width:86px;height:6px;border-radius:9px;background:rgba(255,255,255,.12);overflow:hidden}
.temp .bar i{display:block;height:100%;width:100%;border-radius:9px;background:linear-gradient(90deg,#7fb4ff,#bfe0ff 35%,#ffd08a 65%,#ff8a3c);background-size:86px 100%;transition:width .4s}
.temp em{font-style:normal;min-width:3.2em;color:var(--ink)}
#frost{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:3;opacity:0;transition:opacity .8s}
.fade{position:fixed;inset:0;pointer-events:none;z-index:25;opacity:0;transition:opacity .55s ease;
  background:radial-gradient(ellipse at 50% 55%,#ffdcae 0%,#f0a868 45%,#5a2c14 100%)}
.fade.on{opacity:1}
.indock{display:none}
body.inside .indock{display:flex}
body.inside #dock,body.inside #brushSeg,body.inside #btnView,body.inside #btnCover{display:none !important}
.placebar{display:none;align-items:center;gap:6px;padding:5px;border-radius:999px;background:var(--glass);border:1px solid rgba(255,180,94,.5);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);pointer-events:auto;box-shadow:0 0 24px rgba(255,168,74,.25),var(--shadow)}
.placebar span{font-size:12px;color:var(--ink);padding:0 8px;white-space:nowrap}
.placebar button{border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--ink);font:inherit;font-size:13px;
  padding:7px 12px;border-radius:999px;cursor:pointer}
.placebar button.ok{background:linear-gradient(180deg,#ffc982,#ffa64a);color:#2a1606;border:0;font-weight:600}
body.placing .placebar{display:flex}
body.placing #dock,body.placing #hint,body.placing #brushSeg{display:none !important}
@keyframes call{0%,100%{box-shadow:var(--shadow)}50%{box-shadow:0 0 0 2px rgba(255,180,94,.7),0 0 26px rgba(255,160,70,.65)}}
.tool.call{animation:call 1.3s ease-in-out infinite;border-color:rgba(255,180,94,.7)}
@media (max-width:720px){ .temp{top:calc(56px + env(safe-area-inset-top));left:12px} .temp .bar{width:64px;background-size:64px 100%} .placebar span{font-size:11px;padding:0 4px} .placebar button{padding:6px 10px} }
.loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  background:radial-gradient(ellipse at 50% 40%,#13253f,#050a14 70%);z-index:30;transition:opacity .8s}
.loading.hide{opacity:0;pointer-events:none}
.loading .flake{font-size:34px;animation:spin 3s linear infinite}
.loading p{margin:0;font-size:13px;color:var(--ink-2);letter-spacing:.1em}
@keyframes spin{to{transform:rotate(360deg)}}

@media (max-width:720px){
  .brand h1{font-size:14px}.brand p{font-size:10.5px}
  .topr{gap:6px;right:10px}.pill{padding:7px 9px;font-size:11px}
  .pill .tx{display:none}
  .tool{padding:7px 7px;min-width:50px;font-size:10px;border-radius:12px}
  .tool .ic{font-size:15px}
  .dock{gap:5px}.sep{display:none}
  .polaroid{width:92px}
  .polos{bottom:calc(168px + env(safe-area-inset-bottom));left:10px}
  .panel{bottom:calc(170px + env(safe-area-inset-bottom))}
  .font b{font-size:19px}
}
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="scene" class="paint" tabindex="0"></canvas>

<canvas id="frost"></canvas>
<div class="fade" id="fade"></div>
<div class="loading" id="loading"><div class="flake">❄</div><p id="loadTx">雪正在落下…</p></div>

<div class="brand">
  <h1>雪林小屋 <span>·</span> 雪地印记</h1>
  <p>林间的空地，留给你写字</p>
</div>
<div class="temp"><span>🌡️</span><div class="bar"><i id="tempFill"></i></div><em id="tempTx">暖和</em></div>

<div class="topr">
  <button class="pill" id="btnView" title="快捷键 V"><span>🗺️</span><span class="tx">平铺写字</span></button>
  <button class="pill on" id="btnCover" title="新雪会慢慢盖住痕迹"><span>🌨️</span><span class="tx">落雪覆盖</span></button>
  <button class="pill" id="btnSound"><span id="sndIc">🔈</span><span class="tx">声音</span></button>
</div>

<div class="bottom">
  <div class="placebar" id="placebar">
    <button data-p="l" title="逆时针 (Q)">↺</button><span id="placeTx">移动鼠标选位置，点击雪地印下</span><button data-p="r" title="顺时针 (E)">↻</button>
    <button data-p="ok" class="ok">✓ 印下</button><button data-p="x" title="取消 (Esc)">✕</button>
  </div>
  <div class="hint" id="hint">按住拖动在雪地上写字 · 点右上「平铺写字」切换俯视，字会更端正</div>
  <div class="seg" id="brushSeg">
    <button data-b="0.10">细</button><button data-b="0.17" class="on">中</button><button data-b="0.28">粗</button>
  </div>
  <div class="dock" id="dock">
    <button class="tool on" data-tool="write"><span class="ic">✍️</span>写字</button>
    <button class="tool" data-tool="foot"><span class="ic">👣</span>脚印</button>
    <button class="tool" data-tool="angel"><span class="ic">🛌</span>躺进雪地</button>
    <button class="tool" data-tool="snowman"><span class="ic">⛄</span>堆雪人</button>
    <button class="tool" data-tool="orbit"><span class="ic">🧭</span>环顾</button>
    <span class="sep"></span>
    <button class="tool" data-act="text"><span class="ic">🔤</span>文字印章</button>
    <button class="tool" data-act="photo"><span class="ic">📷</span>宝丽来</button>
    <button class="tool" data-act="clear"><span class="ic">🧹</span>清雪</button>
    <button class="tool" data-act="cabin" id="btnCabin"><span class="ic">🏠</span>进屋取暖</button>
  </div>
  <div class="dock indock" id="indock">
    <button class="tool" data-in="fire"><span class="ic">🪵</span>添柴</button>
    <button class="tool" data-in="cocoa"><span class="ic">☕</span>热可可</button>
    <button class="tool" data-in="cat"><span class="ic">🐱</span>撸猫</button>
    <button class="tool" data-in="photo"><span class="ic">📷</span>宝丽来</button>
    <button class="tool" data-in="out"><span class="ic">🚪</span>出门玩雪</button>
  </div>
</div>

<div class="panel" id="panel">
  <h3><span>🔤 把一句话印进雪地</span><button id="panelX">✕</button></h3>
  <input id="txt" maxlength="14" placeholder="输入想写的字，比如：初雪快乐" value="初雪快乐">
  <div class="fonts" id="fonts"></div>
  <div class="row">
    <div class="seg" id="sizeSeg"><button data-s="0.7">小</button><button data-s="1" class="on">中</button><button data-s="1.35">大</button></div>
    <button class="go" id="goText">选位置，印到雪地 ❄</button>
  </div>
  <div class="tip">点按钮后会出现文字预览：电脑上移动鼠标选位置、点击印下（滚轮或 Q/E 旋转）；手机上拖动预览，点 ✓ 印下。字体从网络加载，若加载失败会自动换成系统楷体。</div>
</div>

<div class="polos" id="polos"></div>
<div class="flash" id="flash"></div>
<div class="toast" id="toast"></div>

<script>
setTimeout(function(){
  if(!window.__snowReady){
    var t=document.getElementById('loadTx');
    if(t) t.textContent='3D 引擎加载较慢，请检查网络后刷新…';
  }
}, 9000);
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================
   0. 基础
   ============================================================ */
const isMobile = matchMedia('(max-width: 760px)').matches ||
  /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);
const TAU = Math.PI * 2;
const clamp = (v,a,b)=> v<a?a:(v>b?b:v);
const lerp = (a,b,t)=> a+(b-a)*t;
const ease = t=> t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
const easeOutBack = t=>{ const c1=1.70158,c3=c1+1; return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2); };
const easeOutBounce = t=>{ const n=7.5625,d=2.75;
  if(t<1/d) return n*t*t; if(t<2/d) return n*(t-=1.5/d)*t+.75;
  if(t<2.5/d) return n*(t-=2.25/d)*t+.9375; return n*(t-=2.625/d)*t+.984375; };
function rng(seed){ return function(){ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed);
  t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

/* 雪地写字区（世界单位） */
const AW = 44, AD = 32, MARGIN = 1.2;
const CW = isMobile ? 1024 : 2048;
const CH = Math.round(CW * AD / AW);
const PX = CW / AW;           // 每世界单位对应的像素
const CABIN_Z = -23;

/* ============================================================
   1. 渲染器 / 场景 / 相机
   ============================================================ */
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: !isMobile, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, isMobile ? 1.25 : 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
const HORIZON = new THREE.Color('#33507a');
scene.fog = new THREE.FogExp2(HORIZON, isMobile ? 0.0125 : 0.0105);

const camera = new THREE.PerspectiveCamera(isMobile ? 55 : 48, innerWidth/innerHeight, 0.1, 1200);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.enablePan = false;
controls.enableRotate = false;
controls.minDistance = 8;
controls.maxDistance = 90;
controls.maxPolarAngle = 1.42;

/* ============================================================
   2. 天空、星星、月亮、极光
   ============================================================ */
{
  const skyMat = new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: {
      cTop: { value: new THREE.Color('#02050d') },
      cMid: { value: new THREE.Color('#0b1a33') },
      cHor: { value: HORIZON.clone() }
    },
    vertexShader: `varying vec3 vP; void main(){ vP = normalize(position);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
    fragmentShader: `uniform vec3 cTop; uniform vec3 cMid; uniform vec3 cHor; varying vec3 vP;
      void main(){ float h = vP.y;
        vec3 c = mix(cHor, cMid, smoothstep(0.0, 0.22, h));
        c = mix(c, cTop, smoothstep(0.22, 0.85, h));
        gl_FragColor = vec4(c, 1.0);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }`
  });
  scene.add(new THREE.Mesh(new THREE.SphereGeometry(500, 32, 16), skyMat));

  // 星星
  const r = rng(77), n = isMobile ? 900 : 1800, pos = [];
  for (let i=0;i<n;i++){
    const th = r()*TAU, ph = Math.acos(lerp(0.12, 1, r()));
    pos.push(Math.sin(ph)*Math.cos(th)*460, Math.cos(ph)*460, Math.sin(ph)*Math.sin(th)*460);
  }
  const sg = new THREE.BufferGeometry();
  sg.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  scene.add(new THREE.Points(sg, new THREE.PointsMaterial({ color:'#dfe9ff', size: isMobile?1.3:1.5,
    sizeAttenuation:false, fog:false, transparent:true, opacity:.85, depthWrite:false })));
}

const MOON_DIR = new THREE.Vector3(-0.55, 0.42, -0.72).normalize();
{
  const c = document.createElement('canvas'); c.width = c.height = 256;

function groundH(x, z){
  const dx = Math.max(0, Math.abs(x) - AW/2), dz = Math.max(0, Math.abs(z) - AD/2);
  const d = Math.hypot(dx, dz);
  if (d === 0){
    return (Math.abs(x) < AW/2 - 0.01 && Math.abs(z) < AD/2 - 0.01) ? -0.35 : 0;
  }
  const cab = Math.hypot(x, z - CABIN_Z);
  const clear = THREE.MathUtils.smoothstep(cab, 7, 15);
  const ramp = THREE.MathUtils.smoothstep(d, 2, 16);
  const hill = 1.4*Math.sin(x*0.08+1.3)*Math.cos(z*0.07) + 0.7*Math.sin(x*0.21+z*0.13) + 1.8 + d*0.04;
  return Math.max(0, hill) * ramp * clear;
}
const SNOW_COLOR = '#e6eef8';

const hc = document.createElement('canvas'); hc.width = CW; hc.height = CH;

const fieldUniforms = {
  uH: { value: hTex },
  uD: { value: 0.17 },
  uSize: { value: new THREE.Vector2(AW, AD) },
  uTexel: { value: new THREE.Vector2(1/CW, 1/CH) }
};
const fieldMat = new THREE.MeshStandardMaterial({ color:SNOW_COLOR, roughness:.9, metalness:0 });
fieldMat.onBeforeCompile = (sh)=>{
  Object.assign(sh.uniforms, fieldUniforms);
  const common = `#include <common>
    uniform sampler2D uH; uniform float uD; uniform vec2 uSize; uniform vec2 uTexel; varying vec2 vHUv;
    float snowH(vec2 uv){ vec4 t = texture2D(uH, uv); return (t.g*0.45*(1.0-t.r) - t.r) * uD; }`;
  sh.vertexShader = sh.vertexShader
    .replace('#include <common>', common)
    .replace('#include <begin_vertex>', `vec3 transformed = vec3(position);
      vHUv = position.xy / uSize + 0.5;
      transformed.z += snowH(vHUv);`);
  sh.fragmentShader = sh.fragmentShader
    .replace('#include <common>', common)
    .replace('#include <color_fragment>', `#include <color_fragment>
      { vec4 t = texture2D(uH, vHUv); float g = t.r; float rim = t.g*(1.0-g);
        diffuseColor.rgb *= mix(vec3(1.0), vec3(0.60,0.72,0.93), smoothstep(0.0,1.0,g));
        diffuseColor.rgb *= 1.0 + rim*0.10; }`)
    .replace('#include <normal_fragment_maps>', `#include <normal_fragment_maps>
      { vec2 ex = vec2(uTexel.x*1.5, 0.0); vec2 ey = vec2(0.0, uTexel.y*1.5);
        float dx = (snowH(vHUv+ex) - snowH(vHUv-ex)) / (2.0*ex.x*uSize.x);
        float dv = (snowH(vHUv+ey) - snowH(vHUv-ey)) / (2.0*ey.y*uSize.y);
        vec3 nW = normalize(vec3(-dx, 1.0, dv));
        normal = normalize((viewMatrix * vec4(nW, 0.0)).xyz); }`);

function makeSprite(fn, w=64, h=64){ const c=document.createElement('canvas'); c.width=w; c.height=h; fn(c.getContext('2d'), w, h); return c; }

function bootShape(g, color, blur){

function stamp(cx, cy, r, a){

}

function stampW(x, z, rW, a){

function footprint(x, z, ang, left){
  if (!inField(x, z)) return;
  const [cx,cy] = w2c(x,z);
  const L = 0.46*PX, Wd = L*0.62;
  hx.save();
  hx.translate(cx, cy);
  hx.rotate(ang + Math.PI/2);
  if (left) hx.scale(-1,1);
  hx.globalCompositeOperation = 'lighter';
  hx.globalAlpha = 0.45;
  hx.drawImage(SPR_FOOT_RIM, -Wd*0.7, -L*0.68, Wd*1.4, L*1.36);
  hx.globalAlpha = 0.9;
  hx.drawImage(SPR_FOOT, -Wd/2, -L/2, Wd, L);
  hx.restore();
  hDirty = true;
}

function woodTexture(snowy=true){
  const c = document.createElement('canvas'); c.width = 256; c.height = 256;
  const g = c.getContext('2d');
  const n = 9, h = 256/n;
  for (let i=0;i<n;i++){
    const gr = g.createLinearGradient(0, i*h, 0, (i+1)*h);
    gr.addColorStop(0,'#2a1810'); gr.addColorStop(.25,'#6b4530'); gr.addColorStop(.55,'#7a5038');
    gr.addColorStop(.85,'#4a2e1f'); gr.addColorStop(1,'#20130c');
    g.fillStyle = gr; g.fillRect(0, i*h, 256, h);
  }
  const r = rng(12);
  g.globalAlpha = .18; g.strokeStyle = '#1b0f08';
  for (let i=0;i<60;i++){ const y = r()*256; g.beginPath(); g.moveTo(r()*256,y); g.lineTo(r()*256, y+r()*2); g.stroke(); }
  // 积雪落在原木缝里
  g.globalAlpha = .35; g.fillStyle = '#dfe9f6';
  if (snowy) for (let i=1;i<n;i++) for (let k=0;k<8;k++) g.fillRect(r()*256, i*h-1.5, 6+r()*22, 1.6);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

function buildCabin(){
  const cab = new THREE.Group();

    const p = new THREE.Mesh(new THREE.BoxGeometry(.24, WH+.1, .24), M.darkWood);
    p.position.set(sx*W2, WH/2, sz*D2); cab.add(p);
  }
  // 山墙
  const tri = new THREE.Shape(); tri.moveTo(-W2,0); tri.lineTo(W2,0); tri.lineTo(0, ridge-WH); tri.closePath();
  const gableGeo = new THREE.ExtrudeGeometry(tri, { depth:.12, bevelEnabled:false });
  for (const sz of [1,-1]){
    const gm = new THREE.Mesh(gableGeo, M.wood);
    gm.position.set(0, WH, sz>0 ? D2-.12 : -D2);
    cab.add(gm);
  }
  // 屋顶 + 屋顶积雪
  const L = W2/Math.cos(a) + .6, depth = D2*2 + .9;
  for (const s of [1,-1]){
    const dir = new THREE.Vector2(s*Math.cos(a), -Math.sin(a));
    const nrm = new THREE.Vector2(s*Math.sin(a), Math.cos(a));
    const roof = new THREE.Mesh(new THREE.BoxGeometry(L, .14, depth), M.roof);
    roof.position.set(dir.x*L/2, ridge + dir.y*L/2 + .05, 0);
    roof.rotation.z = -s*a;
    cab.add(roof);
    const sn = new THREE.Mesh(new THREE.BoxGeometry(L+.12, .24, depth+.12), M.snow);
    sn.position.set(dir.x*L/2 + nrm.x*.17, ridge + dir.y*L/2 + .05 + nrm.y*.17, 0);
    sn.rotation.z = -s*a;
    cab.add(sn);
    // 冰凌
    const eaveX = dir.x*L, eaveY = ridge + dir.y*L;
    const ir = rng(s>0?3:5);
    for (let i=0;i<11;i++){
      const h = .15 + ir()*.35;
      const ic = new THREE.Mesh(new THREE.ConeGeometry(.045, h, 5), M.ice);
      ic.rotation.x = Math.PI;

  // 门
  const doorway = new THREE.Mesh(new THREE.PlaneGeometry(.9, 1.6), M.glow);
  doorway.position.set(0, 1.02, D2 + .004); cab.add(doorway);
  const pivot = new THREE.Group(); pivot.position.set(-.475, 0, D2 + .04); cab.add(pivot);
  cabinDoor = pivot;
  const door = new THREE.Mesh(new THREE.BoxGeometry(.95, 1.65, .08), M.darkWood);
  door.position.set(.475, .2 + .82, 0); pivot.add(door);
  const knob = new THREE.Mesh(new THREE.SphereGeometry(.05, 8, 8), M.bulb);
  knob.position.set(.8, 1.0, .06); pivot.add(knob);
  const wreath = new THREE.Mesh(new THREE.TorusGeometry(.2, .06, 8, 18), new THREE.MeshStandardMaterial({ color:'#1f4a32', roughness:.8 }));
  wreath.position.set(.475, 1.42, .06); pivot.add(wreath);
  const bow = new THREE.Mesh(new THREE.SphereGeometry(.06, 8, 8), new THREE.MeshStandardMaterial({ color:'#c7402d' }));
  bow.position.set(.475, 1.24, .1); pivot.add(bow);

  // 窗户
  const addWindow = (x, y, z, ry, w=.78, h=.78)=>{
    const g = new THREE.Group();
    const glass = new THREE.Mesh(new THREE.PlaneGeometry(w, h), M.glow);
    g.add(glass);
    const fr = (bw, bh, px, py)=>{ const b = new THREE.Mesh(new THREE.BoxGeometry(bw, bh, .07), M.darkWood); b.position.set(px, py, .02); g.add(b); };
    fr(w+.14, .08, 0, h/2); fr(w+.14, .08, 0, -h/2); fr(.08, h, -w/2, 0); fr(.08, h, w/2, 0);
    fr(.05, h, 0, 0); fr(w, .05, 0, 0);
    const sill = new THREE.Mesh(new THREE.BoxGeometry(w+.3, .1, .22), M.snow);
    sill.position.set(0, -h/2 - .07, .08); g.add(sill);
    g.position.set(x, y, z); g.rotation.y = ry;
    cab.add(g);
  };
  addWindow(-1.45, 1.35, D2 + .01, 0);
  addWindow( 1.45, 1.35, D2 + .01, 0);
  addWindow(0, WH + .75, D2 + .01, 0, .5, .5);
  addWindow( W2 + .01, 1.35, 0, Math.PI/2);
  addWindow(-W2 - .01, 1.35, 0, -Math.PI/2);

  // 门灯
  const lamp = new THREE.Mesh(new THREE.SphereGeometry(.09, 10, 10), M.bulb);
  lamp.position.set(-.72, 1.9, D2 + .18); cab.add(lamp);

  // 檐下暖灯串（沿山墙斜边）
  const bulbGeo = new THREE.SphereGeometry(.055, 8, 8);
  for (const s of [-1,1]){
    for (let i=0;i<=8;i++){
      const t = i/8;
      const b = new THREE.Mesh(bulbGeo, M.bulb);
      b.position.set(s*lerp(0, W2+.45, t), lerp(ridge + .02, WH - .3, t) - .12 - Math.sin(t*Math.PI*4)*.03, D2 + .5);
      cab.add(b);
    }
  }

  // 烟囱
  const ch = new THREE.Mesh(new THREE.BoxGeometry(.55, 1.9, .55), M.stone);
  ch.position.set(1.25, ridge - .1, -.6); cab.add(ch);
  const chCap = new THREE.Mesh(new THREE.BoxGeometry(.7, .16, .7), M.snow);
  chCap.position.set(1.25, ridge + .9, -.6); cab.add(chCap);

  // 门前台阶与积雪堆
  const step = new THREE.Mesh(new THREE.BoxGeometry(1.6, .18, .7), M.darkWood);
  step.position.set(0, .12, D2 + .4); cab.add(step);
  const drift = new THREE.SphereGeometry(1, 16, 10);
  const dr = rng(9);
  for (let i=0;i<9;i++){
    const d = new THREE.Mesh(drift, M.snow);
    const side = i%2 ? 1 : -1;
    d.scale.set(.6+dr()*.7, .22+dr()*.18, .5+dr()*.5);
    d.position.set(side*(1.1 + dr()*2), 0, D2 + .2 + dr()*.4);

  // 木柴堆
  const logGeo = new THREE.CylinderGeometry(.11, .11, 1.1, 8);
  for (let i=0;i<7;i++){
    const lg = new THREE.Mesh(logGeo, M.darkWood);
    lg.rotation.x = Math.PI/2;
    const row = i<4 ? 0 : (i<6 ? 1 : 2), col = i<4 ? i : (i<6 ? i-4 : 0);

  const logSnow = new THREE.Mesh(new THREE.BoxGeometry(.3, .08, 1.0), M.snow);
  logSnow.position.set(-W2 - .45, .62, -.66); cab.add(logSnow);

  shadowAll(cab);
  cab.traverse(m=>{ if (m.material === M.glow || m.material === M.bulb || m.material === M.ice) m.castShadow = false; });
  cab.position.set(0, 0, CABIN_Z);
  cab.rotation.y = 0;
  scene.add(cab);

  chimneyTop.set(1.25, ridge + 1.05, -.6).add(cab.position);

  const wl = new THREE.PointLight('#ffad5a', 22, 16, 1.6);
  wl.position.set(0, 1.5, D2 + 1.4).add(cab.position);
  scene.add(wl); windowLights.push(wl);
}

function buildForest(){
  const r = rng(2024);
  const spots = [];
  const N = isMobile ? 130 : 280;
  let guard = 0;
  // 小屋两侧与身后的近树
  const near = [[-7.5,-24],[-9.5,-27],[-6.5,-29.5],[7.8,-25],[10,-28.5],[6.8,-30.5],[-12,-21],[12.5,-21.5],[0,-31],[-3.5,-32.5],[3.8,-33]];
  for (const [x,z] of near) spots.push([x, z, 1.1 + r()*.5]);
  while (spots.length < N && guard++ < 6000){
    const x = lerp(-120, 120, r()), z = lerp(-130, 40, r());
    if (Math.abs(x) < AW/2 + 2.5 && Math.abs(z) < AD/2 + 2.5) continue;
    if (Math.hypot(x, z - CABIN_Z) < 7) continue;
    if (z > AD/2 - 2 && Math.abs(x) < 34) continue;
    if (z > 30 && Math.abs(x) < 70) continue;
    const back = z < -20 ? 1.4 : 1;
    if (r() > .55*back && Math.hypot(x,z) > 70) continue;
    spots.push([x, z, (.75 + r()*.9) * (Math.hypot(x,z) > 50 ? 1.3 : 1)]);
  }
  const parts = [];
  const add = (geo, mat, shadow)=> parts.push({ geo, mat, shadow });
  const tg = new THREE.CylinderGeometry(.16, .24, 1.2, 7); tg.translate(0, .6, 0);
  add(tg, M.darkWood, true);
  const pineMat = new THREE.MeshStandardMaterial({ color:'#1b3a33', roughness:.95 });
  const tiers = [[1.7, 2.4, 1.5], [1.3, 2.1, 2.7], [.85, 1.8, 3.8]];
  for (const [rad, h, y] of tiers){
    const g = new THREE.ConeGeometry(rad, h, 9); g.translate(0, y, 0); add(g, pineMat, true);
    const s = new THREE.ConeGeometry(rad*.82, h*.5, 9); s.translate(0, y + h*.27, 0); add(s, M.snow, false);
  }
  const dummy = new THREE.Object3D();
  for (const p of parts){
    const im = new THREE.InstancedMesh(p.geo, p.mat, spots.length);
    spots.forEach(([x,z,s], i)=>{
      dummy.position.set(x, groundH(x,z) - .15, z);
      dummy.rotation.set(0, (x*13.7 + z*7.1) % TAU, 0);
      dummy.scale.set(s, s*(.95 + ((x*z)%0.2)), s);
      dummy.updateMatrix();
      im.setMatrixAt(i, dummy.matrix);
    });
    im.castShadow = p.shadow && !isMobile;
    im.receiveShadow = true;
    scene.add(im);
  }
  if (isMobile){ // 手机只让近树投影
    moonLight.shadow.camera.updateProjectionMatrix();
  }
}

const PUFF_N = 500;
const puffPos = new Float32Array(PUFF_N*3), puffA = new Float32Array(PUFF_N), puffS = new Float32Array(PUFF_N);

function puff(x, y, z, n, power=1){
  if (isMobile) n = Math.ceil(n*.6);
  for (let k=0;k<n;k++){
    const i = puffHead; puffHead = (puffHead+1) % PUFF_N;
    const a = Math.random()*TAU, sp = (.4 + Math.random())*1.6*power;
    puffPos[i*3] = x + (Math.random()-.5)*.3; puffPos[i*3+1] = y; puffPos[i*3+2] = z + (Math.random()-.5)*.3;
    puffV[i*3] = Math.cos(a)*sp; puffV[i*3+1] = (1 + Math.random()*1.6)*power; puffV[i*3+2] = Math.sin(a)*sp;
    puffL[i] = 1; puffS[i] = .5 + Math.random()*1.1;
  }
}
function updatePuffs(dt){
  for (let i=0;i<PUFF_N;i++){
    if (puffL[i] <= 0){ puffA[i] = 0; continue; }
    puffL[i] -= dt*.9;
    puffV[i*3+1] -= dt*3.2;
    puffV[i*3] *= .97; puffV[i*3+2] *= .97;
    puffPos[i*3] += puffV[i*3]*dt; puffPos[i*3+1] = Math.max(.02, puffPos[i*3+1] + puffV[i*3+1]*dt); puffPos[i*3+2] += puffV[i*3+2]*dt;
    puffA[i] = Math.max(0, puffL[i]);
  }
  puffGeo.attributes.position.needsUpdate = true;
  puffGeo.attributes.aA.needsUpdate = true;
  puffGeo.attributes.aS.needsUpdate = true;
}

function lumpySphere(r, seed){
  const g = new THREE.SphereGeometry(r, 28, 20);
  const p = g.attributes.position, v = new THREE.Vector3();
  for (let i=0;i<p.count;i++){
    v.fromBufferAttribute(p, i);
    const n = Math.sin(v.x*7.1+seed)*Math.sin(v.y*6.3+seed*2)*Math.sin(v.z*8.2+seed*.5);
    v.multiplyScalar(1 + n*.035);
    p.setXYZ(i, v.x, v.y, v.z);
  }
  g.computeVertexNormals();
  return g;
}
const coal = new THREE.MeshStandardMaterial({ color:'#16161a', roughness:.6 });
const carrotMat = new THREE.MeshStandardMaterial({ color:'#ff8a2c', roughness:.6 });
const SCARVES = ['#d9472f', '#ff9a3c', '#3c74d4', '#b8343c', '#2f8f7a'];
const snowmen = [];
let building = null;

class Snowman {
  constructor(x, z){
    this.x = x; this.z = z;
    this.s = .95 + Math.random()*.3;
    this.step = 0;
    this.t0 = 0;
    const s = this.s;
    this.r1 = .66*s; this.r2 = .48*s; this.r3 = .34*s;
    this.y1 = this.r1*.86; this.y2 = this.y1 + this.r1*.78 + this.r2*.78; this.y3 = this.y2 + this.r2*.8 + this.r3*.84;
    this.g = new THREE.Group();
    this.g.position.set(x, 0, z);
    this.g.rotation.y = Math.atan2(camera.position.x - x, camera.position.z - z);
    scene.add(this.g);
    const seed = Math.random()*10;
    this.b1 = new THREE.Mesh(lumpySphere(this.r1, seed), M.snow);
    this.b2 = new THREE.Mesh(lumpySphere(this.r2, seed+3), M.snow);
    this.b3 = new THREE.Mesh(lumpySphere(this.r3, seed+7), M.snow);
    for (const b of [this.b1, this.b2, this.b3]){ b.castShadow = b.receiveShadow = true; b.visible = false; this.g.add(b); }
    this.acc = this.buildAcc();
    this.acc.forEach(a=>{ a.visible = false; this.g.add(a); });
    const ang = Math.random()*TAU;
    this.dir = new THREE.Vector2(Math.cos(ang), Math.sin(ang));
    this.rollLen = 3.4;
    if (!inField(x + this.dir.x*this.rollLen, z + this.dir.y*this.rollLen, 1.5)) this.dir.multiplyScalar(-1);
    this.lastRoll = null;
  }
  buildAcc(){
    const s = this.s, r3 = this.r3, r2 = this.r2, y2 = this.y2, y3 = this.y3;
    const list = [];
    const mk = (geo, mat, x, y, z)=>{ const m = new THREE.Mesh(geo, mat); m.position.set(x,y,z); m.castShadow = true; m.userData.base = m.position.clone(); return m; };
    const eyeG = new THREE.SphereGeometry(.045*s, 8, 8);
    const eyes = new THREE.Group();
    eyes.add(mk(eyeG, coal, -.12*s, y3 + .08*s, r3*.9));
    eyes.add(mk(eyeG, coal,  .12*s, y3 + .08*s, r3*.9));
    for (let i=0;i<5;i++){
      const a = lerp(-.8, .8, i/4);
      eyes.add(mk(new THREE.SphereGeometry(.028*s, 6, 6), coal, Math.sin(a)*r3*.42, y3 - .1*s - Math.cos(a)*.05*s + .05*s, r3*.88));
    }
    list.push(eyes);
    const nose = mk(new THREE.ConeGeometry(.06*s, .36*s, 10), carrotMat, 0, y3, r3 + .14*s);
    nose.rotation.x = Math.PI/2; list.push(nose);
    const btn = new THREE.Group();
    for (let i=0;i<3;i++) btn.add(mk(new THREE.SphereGeometry(.05*s, 8, 8), coal, 0, y2 + r2*.45 - i*r2*.42, r2*.93 - Math.abs(i-1)*.04));
    list.push(btn);
    const armMat = M.darkWood;
    for (const sd of [-1,1]){
      const arm = new THREE.Group();
      const main = new THREE.Mesh(new THREE.CylinderGeometry(.022*s, .032*s, 1.0*s, 6), armMat);
      main.position.y = .5*s; arm.add(main);
      const twig = new THREE.Mesh(new THREE.CylinderGeometry(.015*s, .02*s, .3*s, 5), armMat);
      twig.position.set(.08*s, .72*s, 0); twig.rotation.z = -.6; arm.add(twig);
      arm.position.set(sd*r2*.85, y2 + .12*s, 0);
      arm.rotation.z = -sd*1.05;
      arm.traverse(m=>{ if (m.isMesh) m.castShadow = true; });
      list.push(arm);
    }
    const hat = new THREE.Group();
    const hatMat = new THREE.MeshStandardMaterial({ color:'#1d2636', roughness:.7 });
    const brim = new THREE.Mesh(new THREE.CylinderGeometry(r3*1.1, r3*1.1, .04*s, 24), hatMat); brim.position.y = 0; hat.add(brim);
    const crown = new THREE.Mesh(new THREE.CylinderGeometry(r3*.7, r3*.76, .44*s, 24), hatMat); crown.position.y = .22*s; hat.add(crown);
    const band = new THREE.Mesh(new THREE.CylinderGeometry(r3*.775, r3*.775, .08*s, 24), new THREE.MeshStandardMaterial({ color:'#c7402d' })); band.position.y = .07*s; hat.add(band);
    const hs = new THREE.Mesh(new THREE.CylinderGeometry(r3*.6, r3*.7, .05*s, 20), M.snow); hs.position.y = .46*s; hat.add(hs);
    hat.position.set(0, y3 + r3*.78, 0); hat.rotation.z = .12;
    hat.traverse(m=>{ if (m.isMesh) m.castShadow = true; });
    list.push(hat);
    const sc = new THREE.MeshStandardMaterial({ color: SCARVES[Math.floor(Math.random()*SCARVES.length)], roughness:.85 });
    const scarf = new THREE.Group();
    const ring = new THREE.Mesh(new THREE.TorusGeometry(r3*.92, .085*s, 10, 24), sc); ring.rotation.x = Math.PI/2; scarf.add(ring);
    const tail = new THREE.Mesh(new THREE.BoxGeometry(.16*s, .5*s, .06*s), sc); tail.position.set(r3*.45, -.25*s, r3*.85); tail.rotation.z = .2; scarf.add(tail);
    scarf.position.set(0, y3 - r3*.82, 0);
    scarf.traverse(m=>{ if (m.isMesh) m.castShadow = true; });
    list.push(scarf);
    return list;
  }
  next(now){
    this.step++; this.t0 = now;
    if (this.step === 1){ this.b1.visible = true; }
    if (this.step === 2){ this.b2.visible = true; }
    if (this.step === 3){ this.b3.visible = true; }
    if (this.step === 4){ this.acc.forEach(a=> a.visible = true); }
  }
  update(now){
    const t = (now - this.t0)/1000;
    const toLocal = (wx, wz)=>{ // 世界偏移 → 组内局部
      const ry = this.g.rotation.y, c = Math.cos(ry), s = Math.sin(ry);
      return [wx*c - wz*s, wx*s + wz*c];
    };
    if (this.step === 1){
      const p = clamp(t/1.1, 0, 1), e = ease(p);
      const k = lerp(.4, 1, e);
      const dist = (1-e)*this.rollLen;
      const wx = this.dir.x*dist, wz = this.dir.y*dist;
      const [lx, lz] = toLocal(wx, wz);
      this.b1.scale.setScalar(k);
      this.b1.position.set(lx, this.y1*k, lz);
      this.b1.rotation.set(0,0,0);
      const axis = new THREE.Vector3(this.dir.y, 0, -this.dir.x);
      this.b1.quaternion.setFromAxisAngle(axis, -dist/this.r1);
      // 滚过的雪地被压出一道
      const gx = this.x + wx, gz = this.z + wz;
      if (this.lastRoll){
        const d = Math.hypot(gx - this.lastRoll[0], gz - this.lastRoll[1]);
        const n = Math.ceil(d / .12);
        for (let i=1;i<=n;i++) stampW(lerp(this.lastRoll[0], gx, i/n), lerp(this.lastRoll[1], gz, i/n), this.r1*.55*k, .16);
      }
      this.lastRoll = [gx, gz];
      if (p < 1 && Math.random() < .35) puff(gx, .1, gz, 2, .5);
    } else if (this.b1.visible){ this.b1.scale.setScalar(1); this.b1.position.set(0, this.y1, 0); }

    const drop = (mesh, y, active)=>{
      if (!mesh.visible) return;
      if (active){
        const p = clamp(t/.65, 0, 1);
        mesh.position.set(0, y + (1 - easeOutBounce(p))*2.6, 0);
        mesh.scale.setScalar(lerp(.6, 1, Math.min(1, p*2)));
      } else { mesh.position.set(0, y, 0); mesh.scale.setScalar(1); }
    };
    drop(this.b2, this.y2, this.step === 2);
    drop(this.b3, this.y3, this.step === 3);

    if (this.step === 4){
      this.acc.forEach((a, i)=>{
        const p = clamp((t - i*.09)/.45, 0, 1);
        a.scale.setScalar(Math.max(.001, easeOutBack(p)));
      });
    }
  }
}
function snowmanTap(x, z, now){
  if (!building){
    if (!inField(x, z, 1.6)){ toast('雪人要堆在空地上哦'); return; }
    building = new Snowman(x, z);
    snowmen.push(building);
  }
  const sm = building;
  sm.next(now);
  const wp = new THREE.Vector3(sm.x, 0, sm.z);
  if (sm.step === 1) toast('⛄ 1/4 · 滚一个大雪球当底座');
  if (sm.step === 2){ toast('⛄ 2/4 · 身体放上去'); puff(wp.x, sm.y1 + sm.r1, wp.z, 14, .7); }
  if (sm.step === 3){ toast('⛄ 3/4 · 脑袋按上'); puff(wp.x, sm.y2 + sm.r2, wp.z, 12, .6); }
  if (sm.step === 4){
    toast('⛄ 完成！胡萝卜、树枝手、帽子和围巾都戴好了');
    puff(wp.x, sm.y3, wp.z, 26, 1);
    // 雪人脚下踩出一圈
    for (let a=0;a<TAU;a+=.25) stampW(sm.x + Math.cos(a)*sm.r1*1.25, sm.z + Math.sin(a)*sm.r1*1.25, .16, .3);
    building = null;
  }
}

    for (const sd of [-1,1]){
      const ap = new THREE.Group(); ap.position.set(sd*.27, .24, -.5);
      const arm = new THREE.Mesh(new THREE.CapsuleGeometry(.085, .5, 4, 8), coat);
      arm.rotation.x = Math.PI/2; arm.position.z = .3; ap.add(arm);
      const mit = new THREE.Mesh(new THREE.SphereGeometry(.1, 8, 8), mat(new THREE.MeshStandardMaterial({ color:'#d24b32' })));
      mit.position.z = .62; ap.add(mit);
      g.add(ap); this.arms.push([ap, sd]);
      const lp = new THREE.Group(); lp.position.set(sd*.12, .22, .2);
      const leg = new THREE.Mesh(new THREE.CapsuleGeometry(.1, .6, 4, 8), pants);
      leg.rotation.x = Math.PI/2; leg.position.z = .4; lp.add(leg);
      const boot = new THREE.Mesh(new THREE.BoxGeometry(.2, .22, .16), mat(new THREE.MeshStandardMaterial({ color:'#3a2418' })));
      boot.position.set(0, .06, .82); lp.add(boot);
      g.add(lp); this.legs.push([lp, sd]);
    }
    g.traverse(m=>{ if (m.isMesh){ m.castShadow = true; } });
    g.position.set(x, 2, z);
    g.rotation.y = this.ry;
    scene.add(g);
    this.landed = false;
  }
  w(lx, lz){ // 局部(x,z) → 世界
    const c = Math.cos(this.ry), s = Math.sin(this.ry);
    return [this.x + lx*c + lz*s, this.z - lx*s + lz*c];
  }
  update(now){
    const t = (now - this.t0)/1000;
    const g = this.g;
    if (t < .5){
      const p = t/.5;
      g.position.y = lerp(2.2, 0, p*p);
      g.rotation.x = lerp(-.5, 0, p);
      return;
    }
    if (!this.landed){
      this.landed = true;
      g.position.y = 0; g.rotation.x = 0;
      for (let z=-.6; z<=.25; z+=.06){ const [wx,wz] = this.w(0, z); stampW(wx, wz, .27, .32); }
      for (let a=0;a<TAU;a+=.35){ const [wx,wz] = this.w(Math.cos(a)*.1, -.86 + Math.sin(a)*.1); stampW(wx, wz, .2, .35); }
      const [cx, cz] = this.w(0, -.3);
      puff(cx, .2, cz, 30, 1.1);
    }
    const SW0 = .5, SW1 = 3.1;
    if (t < SW1){
      const p = clamp((t - SW0)/(SW1 - SW0), 0, 1);
      const osc = (1 - Math.cos(p*Math.PI*6))/2;
      const th = lerp(.2, 2.55, osc), ph = lerp(.05, .55, osc);
      const pth = this.pth ?? th, pph = this.pph ?? ph;
      this.pth = th; this.pph = ph;
      const na = Math.max(1, Math.ceil(Math.abs(th - pth)/.07));
      for (const [ap, sd] of this.arms){
        ap.rotation.y = sd*th;
        for (let k=1;k<=na;k++){
          const a = lerp(pth, th, k/na);
          for (let r=.15; r<=.72; r+=.09){
            const [wx, wz] = this.w(sd*.27 + sd*Math.sin(a)*r, -.5 + Math.cos(a)*r);
            stampW(wx, wz, .14, .2);
          }
        }
      }
      const nl = Math.max(1, Math.ceil(Math.abs(ph - pph)/.05));
      for (const [lp, sd] of this.legs){
        lp.rotation.y = sd*ph;
        for (let k=1;k<=nl;k++){
          const a = lerp(pph, ph, k/nl);
          for (let r=.1; r<=.9; r+=.1){
            const [wx, wz] = this.w(sd*.12 + sd*Math.sin(a)*r, .2 + Math.cos(a)*r);
            stampW(wx, wz, .15, .18);
          }
        }
      }
      return;
    }
    if (!this.filled){ // 补齐整片翅膀（低帧率设备也能完整留下雪天使）
      this.filled = true;
      for (let a=.2; a<=2.55; a+=.06) for (const sd of [-1,1]) for (let r=.15; r<=.72; r+=.09){
        const [wx, wz] = this.w(sd*.27 + sd*Math.sin(a)*r, -.5 + Math.cos(a)*r); stampW(wx, wz, .14, .12); }
      for (let a=.05; a<=.55; a+=.04) for (const sd of [-1,1]) for (let r=.1; r<=.9; r+=.1){
        const [wx, wz] = this.w(sd*.12 + sd*Math.sin(a)*r, .2 + Math.cos(a)*r); stampW(wx, wz, .15, .12); }
    }
    const p = clamp((t - SW1)/.9, 0, 1);
    g.position.y = easeOutBack(p)*1.2;
    g.rotation.x = -p*1.2;
    this.mats.forEach(m=> m.opacity = 1 - p);
    if (p >= 1){
      scene.remove(g);
      g.traverse(m=>{ if (m.isMesh) m.geometry.dispose(); });
      this.mats.forEach(m=> m.dispose());
      this.done = true;
    }
  }
}

/* ============================================================
   10. 视角：立体 / 平铺写字
   ============================================================ */
let viewMode = 'persp';
let tween = null;
function perspView(){
  const a = camera.aspect;
  const k = a < 1 ? 1/Math.pow(a, .72) : 1;
  return { pos: new THREE.Vector3(0, 11.5*k, 25 + (k-1)*16), tgt: new THREE.Vector3(0, 0, -5) };
}
function topView(){
  const a = camera.aspect, t = Math.tan(THREE.MathUtils.degToRad(camera.fov/2));
  const fitW = a < 1 ? AW*.62 : AW + 1;
  const h = Math.max((AD/2 + 1)/t, (fitW/2)/(t*a)) * 1.02;
  return { pos: new THREE.Vector3(0, h, .001), tgt: new THREE.Vector3(0, 0, 0) };
}
function goView(mode, instant){
  viewMode = mode;
  const v = mode === 'top' ? topView() : perspView();
  if (instant){
    camera.position.copy(v.pos); controls.target.copy(v.tgt); camera.lookAt(v.tgt); controls.update();
    tween = null; return;
  }
  tween = { p0: camera.position.clone(), t0v: controls.target.clone(), p1: v.pos, t1: v.tgt, start: performance.now(), dur: 1200 };
  updateViewBtn(mode);
}
function updateViewBtn(mode){
  const b = document.getElementById('btnView');
  b.classList.toggle('on', mode === 'top');
  b.querySelector('.tx').textContent = mode === 'top' ? '立体视角' : '平铺写字';
  b.firstElementChild.textContent = mode === 'top' ? '🏔️' : '🗺️';
  controls.maxPolarAngle = mode === 'top' ? .02 : 1.42;
  controls.minPolarAngle = 0;
}
function updateTween(now){
  if (!tween) return;
  const p = clamp((now - tween.start)/tween.dur, 0, 1), e = ease(p);
  // 弧线过渡：中途略微抬高
  camera.position.lerpVectors(tween.p0, tween.p1, e);
  camera.position.y += Math.sin(e*Math.PI)*(tween.arc ?? 4);
  controls.target.lerpVectors(tween.t0v, tween.t1, e);
  camera.lookAt(controls.target);
  if (p >= 1){ const done = tween.done; tween = null; controls.update(); done && done(); }
}

/* ============================================================
   11. 指针交互（直接对地平面求交，带合并事件 → 更灵敏）
   ============================================================ */
const ray = new THREE.Raycaster();
const groundPlane = new THREE.Plane(new THREE.Vector3(0,1,0), 0);
const ndc = new THREE.Vector2(), hit = new THREE.Vector3();
function pick(clientX, clientY){
  const r = canvas.getBoundingClientRect();
  ndc.set(((clientX - r.left)/r.width)*2 - 1, -((clientY - r.top)/r.height)*2 + 1);
  ray.setFromCamera(ndc, camera);
  return ray.ray.intersectPlane(groundPlane, hit) ? [hit.x, hit.z] : null;
}

let tool = 'write';
let brushW = .17;
let drawing = false, activeId = null;
let sP0 = null, sMid = null;        // 平滑笔画（画布像素）
let fLast = null, fAcc = 0, fLeft = false, fAng = 0;

// 光标环
const cursor = new THREE.Mesh(new THREE.RingGeometry(.86, 1, 40), new THREE.MeshBasicMaterial({ color:'#ffd6a0', transparent:true, opacity:.55, depthWrite:false, toneMapped:false }));
cursor.rotation.x = -Math.PI/2; cursor.position.y = .03; cursor.visible = false;
scene.add(cursor);

function strokeTo(cx, cy){
  const r = brushW*PX;
  const spacing = Math.max(1, r*.32);
  if (!sP0){ sP0 = [cx,cy]; sMid = [cx,cy]; stamp(cx, cy, r, .42); return; }
  const mid = [(sP0[0]+cx)/2, (sP0[1]+cy)/2];
  // 二次贝塞尔：sMid → (控制点 sP0) → mid
  const len = Math.hypot(sP0[0]-sMid[0], sP0[1]-sMid[1]) + Math.hypot(mid[0]-sP0[0], mid[1]-sP0[1]);
  const n = Math.max(1, Math.ceil(len/spacing));
  for (let i=1;i<=n;i++){
    const t = i/n, u = 1-t;
    const x = u*u*sMid[0] + 2*u*t*sP0[0] + t*t*mid[0];
    const y = u*u*sMid[1] + 2*u*t*sP0[1] + t*t*mid[1];
    const [wx, wz] = c2w(x, y);
    if (inField(wx, wz)) stamp(x, y, r, .42);
  }
  sMid = mid; sP0 = [cx, cy];
}
function strokeEnd(){
  if (sP0 && sMid){
    const r = brushW*PX, spacing = Math.max(1, r*.32);
    const d = Math.hypot(sP0[0]-sMid[0], sP0[1]-sMid[1]), n = Math.ceil(d/spacing);
    for (let i=1;i<=n;i++){
      const x = lerp(sMid[0], sP0[0], i/n), y = lerp(sMid[1], sP0[1], i/n);
      const [wx, wz] = c2w(x, y);
      if (inField(wx, wz)) stamp(x, y, r, .42);
    }
  }
  sP0 = sMid = null;
}
function footTo(x, z){
  if (!fLast){ fLast = [x,z]; fAcc = .55; return; }
  const dx = x - fLast[0], dz = z - fLast[1], d = Math.hypot(dx, dz);
  if (d < 1e-4) return;
  fAng = Math.atan2(dz, dx);
  const STEP = .62;
  let walked = 0;
  while (fAcc + (d - walked) >= STEP){
    const need = STEP - fAcc;
    walked += need; fAcc = 0;
    const t = walked/d;
    const px = fLast[0] + dx*t, pz = fLast[1] + dz*t;
    const side = fLeft ? -1 : 1;
    const ox = -Math.sin(fAng)*.15*side, oz = Math.cos(fAng)*.15*side;
    footprint(px + ox, pz + oz, fAng, fLeft);
    if (Math.random() < .5) puff(px + ox, .05, pz + oz, 2, .35);
    fLeft = !fLeft;
    crunch();
  }
  fAcc += d - walked;
  fLast = [x, z];
}

function handleMove(e){
  const evs = (e.getCoalescedEvents && e.getCoalescedEvents().length) ? e.getCoalescedEvents() : [e];
  for (const ev of evs){
    const p = pick(ev.clientX, ev.clientY);
    if (!p) continue;
    if (tool === 'write'){ const [cx,cy] = w2c(p[0], p[1]); strokeTo(cx, cy); }
    else if (tool === 'foot') footTo(p[0], p[1]);
  }
}

function setNdc(x, y){ const r = canvas.getBoundingClientRect(); ndc.set(((x - r.left)/r.width)*2 - 1, -((y - r.top)/r.height)*2 + 1); }
function hitCabin(x, y){ if (!cabinGroup) return false; setNdc(x, y); ray.setFromCamera(ndc, camera); return ray.intersectObject(cabinGroup, true).length > 0; }
let hoverT = 0;
canvas.addEventListener('pointerdown', (e)=>{
  if (mode === 'in'){ inDown(e); return; }
  if (mode !== 'out') return;
  if (e.button !== undefined && e.button !== 0) return;
  if (placing){
    const q = pick(e.clientX, e.clientY); if (!q) return;
    setPlace(q[0], q[1]);
    if (e.pointerType === 'mouse') commitPlace();
    else { placing.dragging = true; activeId = e.pointerId; canvas.setPointerCapture && canvas.setPointerCapture(e.pointerId); }
    return;
  }
  if (tool === 'orbit') return;
  if (hitCabin(e.clientX, e.clientY)){ enterCabin(); return; }
  const p = pick(e.clientX, e.clientY);
  if (!p) return;
  const now = performance.now();
  if (tool === 'angel'){
    if (!inField(p[0], p[1], 1.8)){ toast('换块空地躺下吧'); return; }
    angels.push(new Angel(p[0], p[1], now));
    toast('🛌 扑通！躺进雪里挥挥手臂……');
    return;
  }
  if (tool === 'snowman'){ snowmanTap(p[0], p[1], now); return; }
  if (!inField(p[0], p[1])) return;
  drawing = true; activeId = e.pointerId;
  canvas.setPointerCapture && canvas.setPointerCapture(e.pointerId);
  if (tool === 'write'){ const [cx,cy] = w2c(p[0], p[1]); sP0 = null; strokeTo(cx, cy); }
  else if (tool === 'foot'){ fLast = null; footTo(p[0], p[1]); }
});
canvas.addEventListener('pointermove', (e)=>{
  if (mode === 'in'){ inMove(e); return; }
  if (mode !== 'out') return;
  if (placing){
    if (e.pointerType === 'mouse' || placing.dragging){ const q = pick(e.clientX, e.clientY); if (q) setPlace(q[0], q[1]); }
    return;
  }
  if (e.pointerType === 'mouse' && !drawing && tool !== 'orbit'){
    const now = performance.now();
    if (now - hoverT > 90){ hoverT = now; canvas.style.cursor = hitCabin(e.clientX, e.clientY) ? 'pointer' : ''; }
  }
  if (tool === 'write' || tool === 'foot'){
    const p = pick(e.clientX, e.clientY);
    if (p && inField(p[0], p[1]) && e.pointerType !== 'touch'){
      cursor.visible = true;
      cursor.position.set(p[0], .03, p[1]);
      const s = tool === 'write' ? brushW*1.25 : .4;
      cursor.scale.setScalar(s);
    } else cursor.visible = false;
  }
  if (!drawing || e.pointerId !== activeId) return;
  handleMove(e);
});
const endDraw = (e)=>{
  if (mode === 'in'){ inUp(e); return; }
  if (placing){ placing.dragging = false; return; }
  if (!drawing || (e && e.pointerId !== activeId)) return;
  drawing = false; activeId = null;
  if (tool === 'write') strokeEnd();
  fLast = null;
};
canvas.addEventListener('pointerup', endDraw);
canvas.addEventListener('pointercancel', endDraw);
canvas.addEventListener('pointerleave', ()=>{ cursor.visible = false; });
canvas.addEventListener('contextmenu', e=> e.preventDefault());

   12. 文字印章（多种特色字体）

const FONTS = [
  { key:'msz', name:'毛笔楷书', fam:'"Ma Shan Zheng"', sample:'雪' },
  { key:'zmx', name:'行书',     fam:'"Zhi Mang Xing"', sample:'雪' },
  { key:'ljm', name:'狂草',     fam:'"Liu Jian Mao Cao"', sample:'雪' },
  { key:'kl',  name:'站酷快乐', fam:'"ZCOOL KuaiLe"', sample:'雪' },
  { key:'hy',  name:'黄油体',   fam:'"ZCOOL QingKe HuangYou"', sample:'雪' },
  { key:'gv',  name:'英文花体', fam:'"Great Vibes"', sample:'Snow' }
];
const FALLBACK = '"Kaiti SC","STKaiti","KaiTi","楷体",serif';
let fontKey = 'msz', sizeK = 1;
{
  const box = document.getElementById('fonts');
  for (const f of FONTS){
    const b = document.createElement('button');
    b.className = 'font' + (f.key === fontKey ? ' on' : '');
    b.dataset.k = f.key;
    b.innerHTML = `<b style='font-family:${f.fam},${FALLBACK}'>${f.sample}</b><small>${f.name}</small>`;
    box.appendChild(b);
  }
  box.addEventListener('click', (e)=>{
    const b = e.target.closest('.font'); if (!b) return;
    fontKey = b.dataset.k;
    box.querySelectorAll('.font').forEach(x=> x.classList.toggle('on', x === b));
    const f = FONTS.find(x=> x.key === fontKey);
    document.getElementById('txt').style.fontFamily = `${f.fam},${FALLBACK}`;
  });
  document.getElementById('txt').style.fontFamily = `${FONTS[0].fam},${FALLBACK}`;
  document.getElementById('sizeSeg').addEventListener('click', (e)=>{
    const b = e.target.closest('button'); if (!b) return;
    sizeK = parseFloat(b.dataset.s);
    document.querySelectorAll('#sizeSeg button').forEach(x=> x.classList.toggle('on', x === b));
  });
}
async function ensureFont(f, text){
  try {
    await Promise.race([ document.fonts.load(`80px ${f.fam}`, text), new Promise(r=> setTimeout(r, 3000)) ]);
    return document.fonts.check(`80px ${f.fam}`, text);
  } catch(e){ return false; }
}
let textJobs = [];
async function stampText(){
  const text = document.getElementById('txt').value.trim();
  if (!text){ toast('先写点什么吧'); return; }
  const f = FONTS.find(x=> x.key === fontKey);
  const ok = await ensureFont(f, text);
  if (!ok) toast('字体没能从网络加载，先用楷体代替');
  const family = `${f.fam},${FALLBACK}`;

  if (mode !== 'out') return;
  const dx = camera.position.x - controls.target.x, dz = camera.position.z - controls.target.z;
  const theta = viewMode === 'top' ? 0 : Math.atan2(-dx, dz);

  const latin = /^[\x00-\x7F]+$/.test(text);
  let fontPx = (latin ? 5.6 : 4.2) * sizeK * PX;
  const meas = document.createElement('canvas').getContext('2d');
  meas.font = `${fontPx}px ${family}`;
  let w = meas.measureText(text).width;
  const maxW = (AW - 2*MARGIN - 6) * PX;
  if (w > maxW){ fontPx *= maxW / w; meas.font = `${fontPx}px ${family}`; w = meas.measureText(text).width; }
  const pad = Math.ceil(fontPx*.35);
  const cw = Math.ceil(w + pad*2), ch = Math.ceil(fontPx*1.45 + pad*2);

  const mask = document.createElement('canvas'); mask.width = cw; mask.height = ch;
  const mg = mask.getContext('2d');
  mg.font = `${fontPx}px ${family}`;
  mg.textAlign = 'center'; mg.textBaseline = 'middle';
  mg.fillStyle = '#fff'; mg.strokeStyle = '#fff';
  mg.lineJoin = 'round'; mg.lineWidth = Math.max(2, PX*.07);
  mg.fillText(text, cw/2, ch/2); mg.strokeText(text, cw/2, ch/2);

  const tint = (color, blur)=>{
    const t = document.createElement('canvas'); t.width = cw; t.height = ch;
    const tg = t.getContext('2d');
    tg.drawImage(mask, 0, 0);
    tg.globalCompositeOperation = 'source-in';
    tg.fillStyle = color; tg.fillRect(0, 0, cw, ch);
    const o = document.createElement('canvas'); o.width = cw; o.height = ch;
    const og = o.getContext('2d');
    og.shadowColor = color; og.shadowBlur = blur;
    og.drawImage(t, 0, 0);
    return o;
  };
  const R = tint('rgb(255,0,0)', Math.max(1.5, PX*.05));
  const G = tint('rgb(0,255,0)', Math.max(4, PX*.28));

  closePanel();
  cancelPlacing();
  startPlacing({ R, G, cw, ch, mask, text, theta });
}

/* ---------- 放置预览 ---------- */
const isCoarse = matchMedia('(pointer: coarse)').matches;
let placing = null;
function startPlacing(job){
  const w = job.cw/PX, h = job.ch/PX;
  const pc = document.createElement('canvas'); pc.width = job.cw; pc.height = job.ch;
  const pg = pc.getContext('2d');
  pg.drawImage(job.mask, 0, 0);
  pg.globalCompositeOperation = 'source-in'; pg.fillStyle = '#ffd9a3'; pg.fillRect(0, 0, job.cw, job.ch);
  const tex = new THREE.CanvasTexture(pc); tex.colorSpace = THREE.SRGBColorSpace;
  const geo = new THREE.PlaneGeometry(w, h); geo.rotateX(-Math.PI/2);
  const grp = new THREE.Group();
  const mat = new THREE.MeshBasicMaterial({ map:tex, transparent:true, opacity:.8, depthWrite:false, toneMapped:false });
  grp.add(new THREE.Mesh(geo, mat));
  const pts = [[-w/2,-h/2],[w/2,-h/2],[w/2,h/2],[-w/2,h/2]].map(([x,z])=> new THREE.Vector3(x, 0, z));
  grp.add(new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({ color:'#ffd9a3', transparent:true, opacity:.6, depthWrite:false, toneMapped:false })));
  scene.add(grp);
  const c = pick(innerWidth/2, innerHeight*.5) || [0, 0];
  placing = { ...job, w, h, grp, mat, x:c[0], z:c[1], dragging:false };
  setPlace(c[0], c[1]);
  cursor.visible = false;
  document.body.classList.add('placing');
  controls.enableRotate = false; controls.enableZoom = false;
  document.getElementById('placeTx').textContent = isCoarse ? '拖动文字到想印的位置，再点 ✓' : '移动鼠标选位置，点击雪地印下';
}
function setPlace(x, z){
  const p = placing; if (!p) return;
  const c = Math.abs(Math.cos(p.theta)), s = Math.abs(Math.sin(p.theta));
  const ex = (c*p.w + s*p.h)/2, ez = (s*p.w + c*p.h)/2;
  const lx = Math.max(0, AW/2 - MARGIN - ex), lz = Math.max(0, AD/2 - MARGIN - ez);
  p.x = clamp(x, -lx, lx); p.z = clamp(z, -lz, lz);
  p.grp.position.set(p.x, .08, p.z);
  p.grp.rotation.y = -p.theta;
}
function rotatePlace(d){ if (!placing) return; placing.theta += d; setPlace(placing.x, placing.z); }
function commitPlace(){
  const p = placing; if (!p) return;
  const [cx, cy] = w2c(p.x, p.z);
  textJobs.push({ R:p.R, G:p.G, cw:p.cw, ch:p.ch, cx, cy, theta:p.theta, start: performance.now(), dur: 900 + p.text.length*180, x: 0 });
  toast(`❄ 正在把「${p.text}」写进雪地…`);
  cancelPlacing();
}
function cancelPlacing(){
  if (!placing) return;
  scene.remove(placing.grp);
  placing.grp.traverse(o=>{ if (o.geometry) o.geometry.dispose(); if (o.material){ if (o.material.map) o.material.map.dispose(); o.material.dispose(); } });
  placing = null;
  document.body.classList.remove('placing');
  controls.enableRotate = tool === 'orbit'; controls.enableZoom = true;
}
document.getElementById('placebar').addEventListener('click', (e)=>{
  const b = e.target.closest('button'); if (!b) return;
  const a = b.dataset.p;
  if (a === 'l') rotatePlace(-Math.PI/12);
  if (a === 'r') rotatePlace(Math.PI/12);
  if (a === 'ok') commitPlace();
  if (a === 'x'){ cancelPlacing(); toast('已取消'); }
});
canvas.addEventListener('wheel', (e)=>{ if (placing){ e.preventDefault(); rotatePlace(e.deltaY > 0 ? .07 : -.07); } }, { passive:false });
function updateTextJobs(now){

      hx.globalAlpha = 1;   hx.drawImage(j.R, -j.cw/2, -j.ch/2);
      hx.restore();
      hDirty = true;
      // 书写前沿扬起雪粒
      const lx = -j.cw/2 + x1, ly = (Math.random()-.5)*j.ch*.5;
      const cx = j.cx + lx*Math.cos(j.theta) - ly*Math.sin(j.theta);
      const cy = j.cy + lx*Math.sin(j.theta) + ly*Math.cos(j.theta);
      const [wx, wz] = c2w(cx, cy);
      if (Math.random() < .6) puff(wx, .05, wz, 2, .45);
      j.x = x1;
    }
    if (p >= 1) textJobs.splice(i, 1);
  }
}

let AC = null, master = null, soundOn = false, windGain = null;
function initAudio(){
  const C = window.AudioContext || window.webkitAudioContext; if (!C) return false;
  AC = new C(); master = AC.createGain(); master.gain.value = 0; master.connect(AC.destination);
  const len = AC.sampleRate*3, buf = AC.createBuffer(1, len, AC.sampleRate), d = buf.getChannelData(0);
  let last = 0; for (let i=0;i<len;i++){ last = (last + .022*(Math.random()*2-1))/1.022; d[i] = last*3.4; }
  const src = AC.createBufferSource(); src.buffer = buf; src.loop = true;
  const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 520;
  const wg = AC.createGain(); wg.gain.value = mode === 'in' ? .1 : .55; windGain = wg;
  src.connect(lp); lp.connect(wg); wg.connect(master); src.start();
  const lfo = AC.createOscillator(); lfo.frequency.value = .065; const lg = AC.createGain(); lg.gain.value = 260;
  lfo.connect(lg); lg.connect(lp.frequency); lfo.start();
  (function bellLoop(){
    setTimeout(()=>{ if (soundOn){ const ns = [523.25,587.33,659.25,783.99,880,1046.5]; bell(ns[Math.floor(Math.random()*ns.length)], .1 + Math.random()*.06); } bellLoop(); }, 2400 + Math.random()*4800);
  })();
  return true;
}
function bell(f, v){
  const t = AC.currentTime, o = AC.createOscillator(), o2 = AC.createOscillator(), g = AC.createGain(), g2 = AC.createGain();
  o.frequency.value = f; o2.frequency.value = f*2.005; g2.gain.value = .2;
  o2.connect(g2); g2.connect(g); o.connect(g); g.connect(master);
  g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(v, t+.02); g.gain.exponentialRampToValueAtTime(.0001, t+3.4);
  o.start(t); o2.start(t); o.stop(t+3.6); o2.stop(t+3.6);
}
function noiseHit(dur, freq, vol, q=1){
  if (!soundOn || !AC) return;
  const t = AC.currentTime, len = Math.floor(AC.sampleRate*dur), b = AC.createBuffer(1, len, AC.sampleRate), d = b.getChannelData(0);
  for (let i=0;i<len;i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/len, 2.2);
  const s = AC.createBufferSource(); s.buffer = b;
  const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;
  const g = AC.createGain(); g.gain.value = vol;
  s.connect(f); f.connect(g); g.connect(master); s.start(t);
}
function setWind(v){ if (!AC || !windGain) return; const t = AC.currentTime; windGain.gain.cancelScheduledValues(t); windGain.gain.setValueAtTime(windGain.gain.value, t); windGain.gain.linearRampToValueAtTime(v, t + 1.2); }
function tone(type, f0, f1, f2, dur, vol, filt){
  if (!soundOn || !AC) return;
  const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.linearRampToValueAtTime(f1, t + dur*.35); o.frequency.linearRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(vol, t + .04); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  if (filt){ const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = filt; f.Q.value = 1.2; o.connect(f); f.connect(g); } else o.connect(g);
  g.connect(master); o.start(t); o.stop(t + dur + .05);
}

function purr(){
  if (!soundOn || !AC) return;
  const t = AC.currentTime, len = Math.floor(AC.sampleRate*1.6), b = AC.createBuffer(1, len, AC.sampleRate), d = b.getChannelData(0);

  const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 220;
  const g = AC.createGain(); g.gain.value = 1.4;
  s.connect(f); f.connect(g); g.connect(master); s.start(t);
}

function spawnEmber(big){
  const s = embers.find(x=> x.userData.life <= 0); if (!s) return;
  s.userData.life = 1;
  s.position.set((Math.random()-.5)*.6, .35, -3.1 + Math.random()*.15);
  s.userData.v.set((Math.random()-.5)*.3, .6 + Math.random()*(big ? 1.6 : .7), .12 + Math.random()*.25);
}
function spawnHeart(){
  const s = hearts.find(x=> x.userData.life <= 0); if (!s) return;
  const p = new THREE.Vector3(); catHead.getWorldPosition(p);
  s.userData.life = 1; s.position.copy(p).add(new THREE.Vector3((Math.random()-.5)*.2, .15, (Math.random()-.5)*.2));
  s.userData.v.set((Math.random()-.5)*.15, .35 + Math.random()*.2, 0);
}

function updateInterior(dt, t){
  fireBoost = Math.max(0, fireBoost - dt*.3);
  const fl = 1 + Math.sin(t*9)*.08 + Math.sin(t*23)*.05 + (Math.random()-.5)*.08;
  fireLight.intensity = 26*fl*(1 + fireBoost*.9);
  flames.forEach((s, i)=>{
    const u = s.userData;
    const h = (.55 + .25*Math.sin(t*7 + u.ph) + .12*Math.sin(t*17 + u.ph*2))*u.k*(1 + fireBoost*.7);
    s.scale.set(.3*(1 + fireBoost*.35), h, 1);
    s.position.set(u.x + Math.sin(t*5 + u.ph)*.03, .22 + h*.42, -3.12 + (i%2)*.06);
  });
  fireGlow.material.opacity = .42 + .08*Math.sin(t*6) + fireBoost*.25;
  candleFlames.forEach((f, i)=> f.scale.set(.07, .13*(1 + Math.sin(t*11 + i*2)*.12), 1));
  lanternLight.intensity = 6*(1 + Math.sin(t*1.3)*.03);
  if (Math.random() < dt*(3 + fireBoost*20)) spawnEmber(fireBoost > .3);
  for (const s of embers){
    const u = s.userData; if (u.life <= 0){ s.material.opacity = 0; continue; }
    u.life -= dt*.7; u.v.x += (Math.random()-.5)*dt*1.5;
    s.position.addScaledVector(u.v, dt);
    s.material.opacity = Math.max(0, u.life);
  }
  // 小猫
  catBody.scale.y = .62*(1 + Math.sin(t*2.2)*.035);
  catPet = Math.max(0, catPet - dt);
  const pk = Math.sin(clamp(catPet/1.8, 0, 1)*Math.PI);
  catHead.rotation.x = -pk*.35; catHead.position.y = .22 + pk*.06;
  catTail.rotation.z = Math.sin(t*(catPet > 0 ? 7 : 1.1))*(catPet > 0 ? .22 : .05);
  for (const s of hearts){
    const u = s.userData; if (u.life <= 0){ s.material.opacity = 0; continue; }
    u.life -= dt*.55; s.position.addScaledVector(u.v, dt);
    s.material.opacity = Math.min(1, u.life*1.6); s.scale.setScalar(.1 + (1 - u.life)*.06);
  }
  // 热可可
  if (sipT >= 0){
    sipT += dt;
    const k = Math.sin(clamp(sipT/1.6, 0, 1)*Math.PI);
    mugGroup.position.y = .645 + k*.28; mugGroup.rotation.z = k*.55;
    if (sipT >= 1.6){ sipT = -1; mugGroup.position.y = .645; mugGroup.rotation.z = 0; }
  }
  for (const s of steams){
    s.userData.t += dt*.33; if (s.userData.t > 1) s.userData.t -= 1;
    const q = s.userData.t;
    s.position.set(MUG_W.x + Math.sin(q*6 + s.userData.ph)*.04, MUG_W.y + .17 + q*.45 + (mugGroup.position.y - .645), MUG_W.z);
    s.scale.setScalar(.06 + q*.16);
    s.material.opacity = Math.sin(q*Math.PI)*.3*(cocoaLeft > 0 ? 1 : .25);
  }
  treeBulbs.forEach(b=>{ const k = .4 + .6*(.5 + .5*Math.sin(t*2 + b.userData.ph)); b.material.color.copy(b.userData.c).multiplyScalar(k); });
  winMat.uniforms.uTime.value = t;
  // 视角
  inYaw = lerp(inYaw, inYawT, .1); inPitch = lerp(inPitch, inPitchT, .1);
  const yaw = inYaw + Math.sin(t*.4)*.012;
  inCam.position.copy(IN_POS);
  inCam.position.y += Math.sin(t*.9)*.006;
  inCam.lookAt(IN_POS.x + Math.sin(yaw)*Math.cos(inPitch), IN_POS.y + Math.sin(inPitch), IN_POS.z - Math.cos(yaw)*Math.cos(inPitch));
}

function warmUp(v){ warmth = Math.min(100, warmth + v); }
function act(a){
  if (a === 'fire'){
    fireBoost = Math.min(1.6, fireBoost + 1); warmUp(8);
    for (let i=0;i<16;i++) spawnEmber(true);
    crackle(true); setTimeout(()=> crackle(true), 120); setTimeout(()=> crackle(false), 260);
    toast(['🪵 添了一块松木，火苗蹿了起来','🔥 噼啪——火更旺了','🪵 松木的香味飘满了屋子'][Math.floor(Math.random()*3)]);
  } else if (a === 'cocoa'){
    if (sipT >= 0) return;
    if (cocoaLeft <= 0){ cocoaLeft = 3; cocoaTop.position.y = .155; toast('☕ 又续了一杯热可可，还加了棉花糖'); return; }
    sipT = 0; cocoaLeft--; warmUp(15); slurp();
    cocoaTop.position.y = .155 - (3 - cocoaLeft)*.035;
    toast(cocoaLeft > 0 ? '☕ 热可可甜甜的，从喉咙一路暖到手心' : '☕ 喝光啦，再点一下就续杯');
  } else if (a === 'cat'){
    catPet = 1.8; warmUp(4);
    for (let i=0;i<4;i++) setTimeout(spawnHeart, i*160);
    meow(); setTimeout(purr, 500);
    toast(['🐱 喵～','🐱 小猫翻了个身，呼噜呼噜','🐱 它往火边又挪了挪','🐱 小猫蹭了蹭你的手'][Math.floor(Math.random()*4)]);
  } else if (a === 'window'){
    toast('🪟 窗外的雪还在下，雪地上的字迹正被慢慢盖住');
  } else if (a === 'photo'){
    takePhoto();
  } else if (a === 'out'){
    exitCabin();
  }
}

/* 室内指针：拖动环顾，点击物件 */
let inDrag = null, inHoverT = 0;
function pickHot(x, y){
  setNdc(x, y); ray.setFromCamera(ndc, inCam);
  const h = ray.intersectObjects(hotspots, false);
  return h.length ? h[0].object.userData.act : null;
}
function inDown(e){
  if (mode !== 'in') return;
  inDrag = { x:e.clientX, y:e.clientY, yaw:inYawT, pitch:inPitchT, moved:false, id:e.pointerId };
  canvas.setPointerCapture && canvas.setPointerCapture(e.pointerId);
}
function inMove(e){
  if (inDrag && e.pointerId === inDrag.id){
    const dx = e.clientX - inDrag.x, dy = e.clientY - inDrag.y;
    if (Math.hypot(dx, dy) > 6) inDrag.moved = true;
    if (inDrag.moved){ inYawT = clamp(inDrag.yaw - dx*.004, -.9, .9); inPitchT = clamp(inDrag.pitch + dy*.003, -.5, .3); }
  } else if (e.pointerType === 'mouse'){
    const now = performance.now();
    if (now - inHoverT > 80){ inHoverT = now; canvas.style.cursor = pickHot(e.clientX, e.clientY) ? 'pointer' : 'grab'; }
  }
}
function inUp(e){
  if (!inDrag) return;
  if (!inDrag.moved && mode === 'in'){ const a = pickHot(e.clientX, e.clientY); if (a) act(a); }
  inDrag = null;
}
document.getElementById('indock').addEventListener('click', (e)=>{
  const b = e.target.closest('[data-in]'); if (!b || mode !== 'in') return;
  act(b.dataset.in);
});

function updateFramePhoto(){
  if (!lastPhotoUrl) return;
  const img = new Image();
  img.onload = ()=>{
    const c = document.createElement('canvas'); c.width = 256; c.height = 296;
    const g = c.getContext('2d');
    g.fillStyle = '#f8f6f1'; g.fillRect(0, 0, 256, 296);
    g.drawImage(img, 14, 14, 228, 228);
    g.fillStyle = '#3a3a36'; g.font = `21px "Ma Shan Zheng",${FALLBACK}`; g.textAlign = 'center';
    g.fillText(lastCaption || '雪地印记', 128, 276);
    const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
    if (frameMat.map) frameMat.map.dispose();
    frameMat.map = t; frameMat.needsUpdate = true;
  };
  img.src = lastPhotoUrl;
}

/* 进出小屋 */
const fadeEl = document.getElementById('fade');
const sleep = (ms)=> new Promise(r=> setTimeout(r, ms));
function tweenTo(pos, tgt, dur, arc = 0){
  return new Promise(res=>{
    tween = { p0: camera.position.clone(), t0v: controls.target.clone(), p1: pos.clone(), t1: tgt.clone(), start: performance.now(), dur, arc, done: res };
  });
}
function animDoor(to, dur = 900){ if (cabinDoor) doorAnim = { from: cabinDoor.rotation.y, to, start: performance.now(), dur }; }
const DOOR_Z = CABIN_Z + 1.84;
async function enterCabin(){
  if (mode !== 'out') return;
  mode = 'trans';
  cancelPlacing(); closePanel();
  drawing = false; activeId = null; sP0 = sMid = null; fLast = null;
  cursor.visible = false; canvas.style.cursor = '';
  controls.enabled = false; controls.minPolarAngle = 0; controls.maxPolarAngle = 1.57;
  toast('🏠 踩着雪走向小屋…');
  await tweenTo(new THREE.Vector3(.5, 1.9, DOOR_Z + 4.6), new THREE.Vector3(0, 1.25, DOOR_Z), 2300, 1.6);
  animDoor(-1.75, 900); doorCreak();
  await sleep(650);
  fadeEl.classList.add('on');
  await tweenTo(new THREE.Vector3(0, 1.35, DOOR_Z + .35), new THREE.Vector3(0, 1.3, DOOR_Z - 2), 900, 0);
  await sleep(120);
  mode = 'in';
  inYaw = inYawT = 0; inPitch = inPitchT = -.1;
  updateFramePhoto();
  document.body.classList.add('inside');
  document.getElementById('hint').textContent = '拖动环顾小屋 · 点壁炉添柴、点热可可喝一口、点小猫摸摸它';
  canvas.className = 'orbit';
  setWind(.1);
  warmNotified = false;
  await sleep(200);
  fadeEl.classList.remove('on');
  toast('🔥 进屋啦，好暖和～ 跺跺脚上的雪');
}
async function exitCabin(){
  if (mode !== 'in') return;
  mode = 'trans';
  fadeEl.classList.add('on');
  await sleep(560);
  document.body.classList.remove('inside');
  camera.position.set(0, 1.45, DOOR_Z + .4);
  controls.target.set(0, 1.0, DOOR_Z + 6);
  camera.lookAt(controls.target);
  setWind(.55);
  fadeEl.classList.remove('on');
  await sleep(350);
  animDoor(0, 1000); setTimeout(doorCreak, 300);
  const v = perspView();
  await tweenTo(v.pos, v.tgt, 2600, 3);
  viewMode = 'persp'; updateViewBtn('persp');
  controls.maxPolarAngle = 1.42; controls.enabled = true;
  mode = 'out';
  setTool(tool);
  toast(warmth > 80 ? '❄ 暖和够了，继续去雪地上玩吧' : '❄ 还有点冷哦，玩一会儿再回来烤火');
}

/* 体温与冰霜 */
const frostCv = document.getElementById('frost');
function drawFrost(){
  const w = innerWidth, h = innerHeight, d = Math.min(devicePixelRatio || 1, 1.5);
  frostCv.width = Math.floor(w*d); frostCv.height = Math.floor(h*d);
  const g = frostCv.getContext('2d');
  g.setTransform(d, 0, 0, d, 0, 0);
  const gr = g.createRadialGradient(w/2, h/2, Math.min(w, h)*.3, w/2, h/2, Math.hypot(w, h)*.58);
  gr.addColorStop(0, 'rgba(220,236,255,0)'); gr.addColorStop(.68, 'rgba(220,236,255,.16)'); gr.addColorStop(1, 'rgba(236,246,255,.66)');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
  g.strokeStyle = 'rgba(244,250,255,1)'; g.lineCap = 'round';
  const r = rng(99);
  const branch = (x, y, a, len, depth)=>{
    const x2 = x + Math.cos(a)*len, y2 = y + Math.sin(a)*len;
    g.lineWidth = Math.max(.5, depth*.6); g.globalAlpha = .16 + depth*.1;
    g.beginPath(); g.moveTo(x, y); g.lineTo(x2, y2); g.stroke();
    if (depth <= 0) return;
    for (const f of [.35, .7]){
      const bx = x + (x2 - x)*f, by = y + (y2 - y)*f;
      branch(bx, by, a + .75 + (r() - .5)*.3, len*.4, depth - 1);
      branch(bx, by, a - .75 + (r() - .5)*.3, len*.4, depth - 1);
    }
    branch(x2, y2, a + (r() - .5)*.4, len*.55, depth - 1);
  };
  const N = Math.round((w + h)/30);
  for (let i=0;i<N;i++){
    const side = Math.floor(r()*4), L = 26 + r()*Math.min(w, h)*.11;
    let x, y, a;
    if (side === 0){ x = r()*w; y = 0; a = Math.PI/2; }
    else if (side === 1){ x = w; y = r()*h; a = Math.PI; }
    else if (side === 2){ x = r()*w; y = h; a = -Math.PI/2; }
    else { x = 0; y = r()*h; a = 0; }
    branch(x, y, a + (r() - .5)*1.1, L, 3);
  }
  g.globalAlpha = 1;
}
const tempFill = document.getElementById('tempFill'), tempTx = document.getElementById('tempTx'), btnCabin = document.getElementById('btnCabin');
let lastFrost = -1, lastTempUI = -1;
function updateWarmth(dt){
  if (mode === 'out') warmth = Math.max(0, warmth - dt*.55);
  else if (mode === 'in') warmth = Math.min(100, warmth + dt*(6 + fireBoost*6));
  const w = Math.round(warmth);
  if (w !== lastTempUI){
    lastTempUI = w;
    tempFill.style.width = w + '%';
    tempTx.textContent = w > 70 ? '暖和' : w > 42 ? '有点冷' : w > 16 ? '好冷' : '冻僵了';
    btnCabin.classList.toggle('call', w < 45);
  }
  const fr = Math.round(clamp((65 - warmth)/65, 0, 1)*100)/100;
  if (fr !== lastFrost){ lastFrost = fr; frostCv.style.opacity = (fr*.95).toFixed(2); }
  if (mode === 'out'){
    if (warmth < 45 && coldWarned < 1){ coldWarned = 1; toast('🥶 有点冷了… 点「🏠 进屋取暖」或直接点小屋'); }
    if (warmth < 18 && coldWarned < 2){ coldWarned = 2; toast('🥶 手都冻僵了！快去小屋里烤烤火'); }
    if (warmth > 80) coldWarned = 0;
  } else if (mode === 'in' && warmth >= 99.5 && !warmNotified){
    warmNotified = true; toast('😊 全身都暖和起来了，随时可以「🚪 出门玩雪」');
  }
}

/* ============================================================
   16. 主循环
   ============================================================ */
let last = performance.now(), coverAcc = 0, uploadAcc = 0;
function loop(now){
  const dt = Math.min(.05, (now - last)/1000); last = now;
  const tSec = now/1000;

  snowU.uTime.value = tSec;
  snowU.uCenter.value.set(controls.target.x, 0, controls.target.z);
  aurora.material.uniforms.uTime.value = tSec;

  updateTween(now);
  if (doorAnim && cabinDoor){
    const dp = clamp((now - doorAnim.start)/doorAnim.dur, 0, 1);
    cabinDoor.rotation.y = lerp(doorAnim.from, doorAnim.to, ease(dp));
    if (dp >= 1) doorAnim = null;
  }
  if (!tween && mode === 'out') controls.update();

  for (const sm of snowmen) sm.update(now);
  for (let i=angels.length-1;i>=0;i--){ angels[i].update(now); if (angels[i].done) angels.splice(i,1); }
  updateTextJobs(now);
  updatePuffs(dt);
  updateSmoke(dt);

  // 灯光轻微呼吸
  const fl = 1 + Math.sin(tSec*2.3)*.04 + Math.sin(tSec*5.1)*.02;
  windowLights.forEach(l=> l.intensity = 22*fl);
  lampLights.forEach((l,i)=> l.intensity = 18*(1 + Math.sin(tSec*1.7 + i)*.03));

  // 新雪覆盖
  if (clearing > 0){ coverStep(16); clearing--; }
  else if (coverOn){
    coverAcc += dt;
    if (coverAcc > .26){ coverAcc = 0; coverStep(1); }
  }

  // 上传高度图（最多每帧一次）
  if (hDirty){ hTex.needsUpdate = true; hDirty = false; }

  updateWarmth(dt);
  if (placing) placing.mat.opacity = .62 + .25*Math.sin(tSec*4);

  if (mode === 'in'){
    updateInterior(dt, tSec);
    if (soundOn && Math.random() < dt*(1.6 + fireBoost*6)) crackle(fireBoost > .5);
    renderer.render(inScene, inCam);
  } else {
    let sh = 0;
    if (mode === 'out' && !tween && warmth < 22) sh = (22 - warmth)/22 * .06;
    const ox = (Math.random()-.5)*sh, oy = (Math.random()-.5)*sh;
    camera.position.x += ox; camera.position.y += oy;
    renderer.render(scene, camera);
    camera.position.x -= ox; camera.position.y -= oy;
  }
  requestAnimationFrame(loop);
}

function onResize(){
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  inCam.aspect = innerWidth/innerHeight; inCam.updateProjectionMatrix();
  drawFrost();
  if (!tween && mode === 'out') goView(viewMode, true);
}
addEventListener('resize', onResize);

goView('persp', true);
setTool('write');
drawFrost();
requestAnimationFrame((t)=>{ last = t; loop(t); });
window.__snowReady = true;
setTimeout(()=>{ document.getElementById('loading').classList.add('hide'); }, 300);
setTimeout(()=> toast(isMobile ? '❄ 手指在雪地上写字试试' : '❄ 在雪地上写字试试 · 按 V 切换平铺视角'), 1400);
</script>
